<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sitetracker Feature Demos</title>
    <meta
      name="description"
      content="Sitetracker customer demo and onboarding pages. Pick a feature to walk through."
    />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="hub-body">
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="page hub">
      <header class="hub__hero">
        <a class="hero__logo" href="./">
          <img src="assets/logo.svg" alt="Sitetracker" width="220" height="20" />
        </a>
        <h1>Feature demos</h1>
        <p class="hub__lead">
          Customer demo and onboarding pages. Open a feature to walk through the videos.
        </p>
      </header>

      <main id="main">
        <ul class="hub__list" id="demo-list" aria-label="Available demos"></ul>
        <p class="hub__empty" id="demo-empty" hidden>
          No demos listed yet. Add an entry to <code>demos/manifest.json</code>.
        </p>
      </main>
    </div>

    <script src="js/hub.js"></script>
  </body>
</html>
